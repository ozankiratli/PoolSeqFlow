name: Documentation

# Builds the MkDocs site and publishes it straight from main. No gh-pages branch: the
# site is uploaded as an artifact and deployed by actions/deploy-pages.
#
# One-time repository setting this depends on:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# It cannot be "Deploy from a branch -> main -> /docs", which serves the folder as-is;
# docs/ holds Markdown, not finished HTML.
#
# Pull requests build with --strict but do not deploy.

on:
  push:
    branches: [main]
    paths:
      - "manual/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - "dev/scripts/build_docs.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "manual/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - "dev/scripts/build_docs.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: manual/requirements.txt

      - name: Install build dependencies
        run: pip install -r manual/requirements.txt

      # docs/ is not in the repository; it is generated from the manual on every build.
      # This also fails on a broken cross-reference, before MkDocs is reached.
      - name: Generate the page tree from the manual
        run: python3 dev/scripts/build_docs.py

      # --strict turns broken internal links and nav references into build failures.
      - name: Build
        run: mkdocs build --strict

      # Fails early and clearly if Pages is not enabled.
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
