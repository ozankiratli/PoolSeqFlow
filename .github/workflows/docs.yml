name: Documentation

# Builds the MkDocs site, and deploys it only for a version that has been released. No
# gh-pages branch: the site is uploaded as an artifact and deployed by actions/deploy-pages.
#
# One-time repository setting this depends on:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# It cannot be "Deploy from a branch -> main -> /docs", which serves the folder as-is;
# docs/ holds Markdown, not finished HTML.
#
# It deploys in two cases: after release.yml publishes a release, built from the commit that
# release was made from, and when run by hand on main (Actions -> Documentation -> Run
# workflow), which is how a module published between releases reaches the site. Both refuse a
# commit whose declared version has no published release. A push to main and a pull request
# build with --strict and deploy nothing.

on:
  push:
    branches: [main]
    paths:
      - "manual/**"
      - "modules/repo/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - "dev/scripts/build_docs.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "manual/**"
      - "modules/repo/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - "dev/scripts/build_docs.py"
      - ".github/workflows/docs.yml"
  # Runs from main's copy of this file whenever release.yml finishes; the build job decides
  # whether that run published anything.
  workflow_run:
    workflows: ["Publish a release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # After release.yml, only a run that published: a pushed tag with every step green. Run by
    # hand, release.yml checks a commit and publishes nothing.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.released.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # The version this commit declares has to have a published release before its pages do.
      - name: Check this version is released
        id: released
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          declared=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' PoolSeqFlow)
          draft=$(gh release view "v$declared" --repo "$GITHUB_REPOSITORY" \
                    --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$draft" != "false" ]; then
            echo "This commit declares $declared, and v$declared has no published release," >&2
            echo "so its pages are not deployed. The site deploys once release.yml publishes it." >&2
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: manual/requirements.txt

      - name: Install build dependencies
        run: pip install -r manual/requirements.txt

      # docs/ is not in the repository; it is generated from the manual on every build.
      # This also fails on a broken cross-reference, before MkDocs is reached.
      - name: Generate the page tree from the manual
        run: python3 dev/scripts/build_docs.py

      # --strict turns broken internal links and nav references into build failures.
      - name: Build
        run: mkdocs build --strict

      # Fails early and clearly if Pages is not enabled.
      - uses: actions/configure-pages@v6
        if: steps.released.outputs.deploy == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.released.outputs.deploy == 'true'
        with:
          path: site

  deploy:
    if: needs.build.outputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
