name: Documentation

# Builds the MkDocs site and publishes it straight from main. There is no
# gh-pages branch: the built site is uploaded as an artifact and deployed by
# actions/deploy-pages, so the repository holds only source and the built HTML
# never lands in a branch anyone has to look at.
#
# One-time repository setting this depends on:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# Note it cannot be "Deploy from a branch -> main -> /docs". That serves the
# folder as-is, and docs/ holds Markdown, not HTML - GitHub would run Jekyll
# over MkDocs sources and produce nonsense. The folder option only works for a
# directory of finished HTML.
#
# Pull requests build with --strict but do not deploy, so a broken link fails in
# review rather than after merge.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install build dependencies
        run: pip install -r docs/requirements.txt

      # --strict turns broken internal links and nav references into build
      # failures, so a bad link is caught here rather than shipped.
      - name: Build
        run: mkdocs build --strict

      # Fails early and clearly if Pages is not enabled, rather than leaving the
      # deploy step to report it less legibly.
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
