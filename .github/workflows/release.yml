name: Publish a release

# Tag a release to publish it: bump VERSION in ./PoolSeqFlow, write the CHANGELOG
# entry, commit, then `git tag v2.1.2 && git push --tags`.
#
# Not GitHub's "Source code" archive: a curated tarball, the pipeline only, wrapped
# in a PoolSeqFlow-<version>/ directory. What goes in is decided by `export-ignore`
# in .gitattributes.
#
# Built with `git archive`, not `tar`, so the executable bit on ./PoolSeqFlow and
# bin/* comes from the git index rather than the runner's umask. tar.gz only: zip
# does not carry that bit reliably.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # verify-archive.sh builds from a git ref, and check-analysis-versions.sh reads which
          # commit last touched each versioned thing. A shallow clone gives the second one the
          # tip commit for every path, which reports a missed version bump as fine.
          fetch-depth: 0

      - name: Work out the version and check everything agrees on it
        id: version
        run: |
          set -euo pipefail

          # The wrapper is the authority: it is what `./PoolSeqFlow version` prints.
          declared=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' PoolSeqFlow)
          if [ -z "$declared" ]; then
            echo "could not find VERSION=\"...\" in ./PoolSeqFlow" >&2
            exit 1
          fi

          # The header comment carries the version too, and nothing keeps the two in step.
          header=$(sed -n 's/^# Version: \(.*\)$/\1/p' PoolSeqFlow)
          if [ "$header" != "$declared" ]; then
            echo "./PoolSeqFlow disagrees with itself:" >&2
            echo "  VERSION=\"$declared\" but the header comment says \"$header\"" >&2
            exit 1
          fi

          # And in nextflow.config's manifest, which is what step 0 records.
          nfversion=$(sed -n "s/^[[:space:]]*version[[:space:]]*=[[:space:]]*'\(.*\)'.*/\1/p" nextflow.config)
          if [ "$nfversion" != "$declared" ]; then
            echo "./PoolSeqFlow says VERSION=\"$declared\" but nextflow.config's" >&2
            echo "  manifest says version = '$nfversion'" >&2
            exit 1
          fi

          # On a tag, the tag has to match. On workflow_dispatch there is no tag,
          # and the run builds and verifies the archive without publishing.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tagged="${GITHUB_REF_NAME#v}"
            if [ "$tagged" != "$declared" ]; then
              echo "tag $GITHUB_REF_NAME expects VERSION=\"$tagged\" in ./PoolSeqFlow," >&2
              echo "but it says \"$declared\"" >&2
              exit 1
            fi
          fi

          # Refuses to publish a version the changelog does not describe. The same extractor
          # that writes the release body, so the gate cannot pass over a section the body step
          # would then fail to read.
          dev/scripts/changelog-section.sh "$declared" > /dev/null

          echo "version=$declared" >> "$GITHUB_OUTPUT"
          echo "name=PoolSeqFlow-$declared" >> "$GITHUB_OUTPUT"
          echo "Building PoolSeqFlow-$declared"

      # Three versions cover the analysis layer and nothing in the pipeline forces any of them
      # to move: analysis/frame.version, the catalogue's #!index-version, and each module's own
      # manifest version. Mid-development one is legitimately behind, which is why this is not
      # in the test suite and is a release gate instead.
      - name: Every analysis version moved with what it covers
        run: dev/scripts/check-analysis-versions.sh --release

      # The same script ci.yml runs on every pull request.
      - name: Build and verify the archive
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          dev/scripts/verify-archive.sh HEAD dist

          # The same archive under a stable name, which is what
          # /releases/latest/download/<asset> needs. The directory inside stays versioned.
          cp "dist/${NAME}.tar.gz" dist/PoolSeqFlow.tar.gz

          ( cd dist && sha256sum ./*.tar.gz > SHA256SUMS )
          ls -lh dist/

      - name: Build the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          # This version's CHANGELOG section, then the standing tail. Runs on every trigger and
          # not only on a tag, so a rehearsal proves the notes extract before the tag exists.
          dev/scripts/changelog-section.sh "$VERSION" > dist/RELEASE_NOTES.md
          printf '\n' >> dist/RELEASE_NOTES.md
          sed -e "1,/^-->$/d" -e "s|@VERSION@|${VERSION}|g" -e "s|@NAME@|${NAME}|g" \
              dev/release-notes-tail.md >> dist/RELEASE_NOTES.md

          [ -s dist/RELEASE_NOTES.md ] || { echo "the release notes came out empty" >&2; exit 1; }
          echo "::group::release body"
          cat dist/RELEASE_NOTES.md
          echo "::endgroup::"

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          body_path: dist/RELEASE_NOTES.md
