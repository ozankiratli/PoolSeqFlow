# PoolSeqFlow analysis-layer conda environment, exported by dev/scripts/export-environment.sh
#
# Every tool is pinned to an exact build so a release always installs the same
# software. Do not edit by hand: change the environment, then re-export.
#
# There is no 'name:' key. Environments are named after the release
# (PoolSeqFlow-<version>-analysis), which is what ./PoolSeqFlow analysis install supplies with -n.
#
# host-glibc-floor: 2.28
#
# The oldest glibc this file installs on. A package pinned here that requires a newer
# one makes the release uninstallable on every older machine, which is a property of
# whoever ran the export rather than of the software. Read by dev/scripts and checked
# by the test suite; raising it drops machines and is a release decision.
channels:
  - conda-forge
  - bioconda
  - defaults
