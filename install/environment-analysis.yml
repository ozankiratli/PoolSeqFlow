# PoolSeqFlow analysis-layer conda environment.
#
# NOT YET PINNED. This is the hand-written specification the first solve starts from.
# dev/scripts/export-environment.sh replaces it with an exact-build export, which is the
# form install/environment.yml is already in and the only form a release may ship.
#
# There is no 'name:' key. Environments are named after the release
# (PoolSeqFlow-<version>-analysis), which is what ./PoolSeqFlow analysis install
# supplies with -n.
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # The analysis layer is a Nextflow pipeline of its own and runs in this environment
  # alone, so it carries its own copy at the pipeline environment's version.
  - nextflow=26.04.6
  # Reading BAMs into per-position depth, and indexing the result for random access.
  - samtools=1.24
  - bcftools=1.24
  - htslib=1.24
  - python
  # GNU behavior for the shell helpers, which is not what macOS provides.
  - bash
  - coreutils
  # bin/atomic_mv.sh copies an artifact with rsync and compares it against its source with
  # diff before the source is removed; the analysis layer moves its own results with it.
  - rsync
  - diffutils
  - findutils
  - r-base
  # Reading the frequency and depth tables, which run to millions of rows.
  - r-data.table
  # Every figure.
  - r-ggplot2
  - r-pheatmap
  # Argument parsing for the module scripts, and the provenance sidecars.
  - r-optparse
  - r-jsonlite
  - r-matrix
  # A module may hand its per-site work out in bins. %dofuture% supersedes %dopar%, and both
  # foreach and future come with it.
  - r-dofuture
  # The compiled path a module offers where it has one. r-base brings the toolchain Rcpp drives
  # - GCC on Linux, clang on macOS - so this adds Rcpp and not a compiler.
  - r-rcpp
  # The PDF report the frame writes beside every published analysis. knitr runs the R that
  # fills the document in, pandoc turns the result into a PDF.
  #
  # PANDOC IS NAMED HERE and not left to arrive with r-rmarkdown. The report is knitted and then
  # handed to pandoc, never rendered by rmarkdown::pdf_document, which is bound to LaTeX and
  # ignores a --pdf-engine argument.
  - r-rmarkdown
  - r-knitr
  - pandoc
  # The engine pandoc hands the document to. Pandoc's own default is LaTeX, which is a gigabyte
  # and more; typst is one binary and does the same job here. Pinned here, never found on the
  # machine.
  - typst
  # Reading a published PNG back so it can be placed in that report, and joining PDFs.
  - r-png
  - qpdf
